[project]
name = "sheetsync"
version = "0.1.0"
description = "Async bidirectional Google Sheets sync"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "google-auth[requests]",
    "tenacity",
    "pydantic>=2",
    "tzdata",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
